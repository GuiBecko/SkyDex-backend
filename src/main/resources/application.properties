spring.datasource.url=${URL_POSTGRES:jdbc:postgresql://localhost:5432/skydex}
spring.datasource.username=${USUARIO_POSTGRES:postgres}
spring.datasource.password=${SENHA_POSTGRES:postgres}

spring.jpa.hibernate.ddl-auto=update

# Off. Every statement Hibernate issues was being printed on the production profile, which costs
# real throughput under load and writes user data — emails, coordinates — into stdout and from
# there into whatever collects it. `application-test.properties` sets its own value; turn this on
# locally when you need it, do not commit it on.
spring.jpa.show-sql=false

# Off so dev/production match the test environment's persistence-context lifetime. Safe here:
# WeatherEvent, UploadedPhoto and User reference each other by plain UUID columns, not
# @ManyToOne/@OneToMany, so there are no lazy associations that OSIV-off would strand.
spring.jpa.open-in-view=false

server.port = 8080

# Where uploaded capture photos are written. The base URL is a read-side concern only: stored
# photo_url values are relative, and WeatherEventController composes this in on the way out.
skydex.photos.directory=${PHOTO_STORAGE_DIR:./data/photos}
skydex.photos.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# The request limit is deliberately above the file limit. A multipart envelope carries a boundary
# and part headers on top of the bytes, so setting them equal would make an exactly-8MB file breach
# the *request* cap first and put the effective ceiling slightly under the 8MB we advertise.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
