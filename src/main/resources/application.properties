spring.datasource.url=${URL_POSTGRES:jdbc:postgresql://localhost:5432/skydex}
spring.datasource.username=${USUARIO_POSTGRES:postgres}
spring.datasource.password=${SENHA_POSTGRES:postgres}

spring.jpa.hibernate.ddl-auto=update

# Off. Every statement Hibernate issues was being printed on the production profile, which costs
# real throughput under load and writes user data — emails, coordinates — into stdout and from
# there into whatever collects it. `application-test.properties` sets its own value; turn this on
# locally when you need it, do not commit it on.
spring.jpa.show-sql=false

# Off so dev/production match the test environment's persistence-context lifetime. Safe here:
# WeatherEvent, UploadedPhoto and User reference each other by plain UUID columns, not
# @ManyToOne/@OneToMany, so there are no lazy associations that OSIV-off would strand.
spring.jpa.open-in-view=false

server.port = ${SERVER_PORT:3002}

# Where uploaded capture photos are written. The base URL is a read-side concern only: stored
# photo_url values are relative, and WeatherEventController composes this in on the way out.
skydex.photos.directory=${PHOTO_STORAGE_DIR:./data/photos}
skydex.photos.public-base-url=${PUBLIC_BASE_URL:http://localhost:3002}

# The request limit is deliberately above the file limit. A multipart envelope carries a boundary
# and part headers on top of the bytes, so setting them equal would make an exactly-8MB file breach
# the *request* cap first and put the effective ceiling slightly under the 8MB we advertise.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# --- Photo vision analysis -----------------------------------------------------------------
# The skydex-vision container (see skydex-vision/docker-compose.yml). Reachable on the host as
# localhost:8000; from inside the compose network it would be http://skydex-vision:8000.
skydex.vision.base-url=${VISION_BASE_URL:http://localhost:8000}

# Stage 1: below this outdoor score, POST /api/photos answers 422 and stores nothing.
# Empirically grounded: skydex-vision's 30-image golden set (skydex-vision/training/train.ipynb)
# puts the worst fraud at 0.0547 and the weakest real sky at 0.7831, so 0.60 sits in the middle of
# a 0.73-wide empty band with no measured example on either side of it. It is not finely tuned and
# small changes to it change nothing observed so far.
#
# skydex-vision/tests/test_phenomenon_golden.py pins the gated false-block rate at zero on every
# honest photograph in that same golden set, using a copy of the contradiction matrix and these
# same two gate constants (expected-score-max, top-score-min) below. If either of those two
# changes, that Python test is what will notice — and only if someone remembers to re-run it.
skydex.vision.outdoor-min=${VISION_OUTDOOR_MIN:0.60}

# Stage 2: a contradiction only blocks when the expected group scored below this AND the winning
# group scored above the one below. Both bars exist so an uncertain model never blocks anyone.
#
# Unlike outdoor-min above, these two are NOT measured: there is no labelled set of photo-versus-
# weather contradiction pairs to derive them from, and this plan does not build one. They are
# starting judgment values chosen to make the gate conservative (favouring letting an upload
# through over blocking an honest one), nothing more. Revisit them once real contradiction data
# exists — and remember skydex-vision/tests/test_phenomenon_golden.py (see above) is the test that
# will catch a change here going wrong.
skydex.vision.expected-score-max=${VISION_EXPECTED_SCORE_MAX:0.10}
skydex.vision.top-score-min=${VISION_TOP_SCORE_MIN:0.70}
