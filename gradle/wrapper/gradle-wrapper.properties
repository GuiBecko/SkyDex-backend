distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.x, deliberately. The Spring Boot 3.2.4 Gradle plugin calls
# CopyProcessingSpec.getDirMode(), which Gradle 9 removed, so `bootJar` fails
# outright on 9.x with:
#   'java.lang.Integer org.gradle.api.file.CopyProcessingSpec.getDirMode()'
# `test` is unaffected, which is why the wrapper sat on 9.6.0 unnoticed: nothing
# in CI or in the test suite ever asked for a jar. Raising this back to 9.x
# requires bumping Spring Boot to a release that supports it.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
